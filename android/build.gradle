plugins {
    id 'com.android.library'
}

// From AGP 9 on Kotlin support is built into the Android Gradle plugin (or,
// when the app opts out with android.builtInKotlin=false, the Flutter Gradle
// plugin applies kotlin-android to plugin modules itself). Apply it here only
// for older AGP versions.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
if (agpMajor < 9) {
    project.pluginManager.apply('org.jetbrains.kotlin.android')
}

group 'de.kevlatus.flutter_broadcasts'
version '1.0-SNAPSHOT'

android {
    namespace 'de.kevlatus.flutter_broadcasts'
    compileSdk = flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk = flutter.minSdkVersion
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
